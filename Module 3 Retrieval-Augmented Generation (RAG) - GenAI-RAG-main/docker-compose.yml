version: '3.8'

services:
  # 1. The Database (Elasticsearch)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"  # Cap memory usage to 1GB to prevent crashes
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - rag-network

  # 2. The Dashboard (Kibana) - Optional but useful for debugging
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - rag-network

  # 3. The AI Brain (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag-network

  # 4. The Backend API (FastAPI)
  fastapi-app:
    build: ./fastapi_app
    container_name: fastapi-app
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=phi3   # <--- Updated to the memory-safe model
      - ELASTIC_URL=http://elasticsearch:9200
    depends_on:
      - ollama
      - elasticsearch
    networks:
      - rag-network

  # 5. The Frontend UI (Streamlit)
  streamlit-app:
    build: ./streamlit_app
    container_name: streamlit-app
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://fastapi-app:8000
    depends_on:
      - fastapi-app
    networks:
      - rag-network

volumes:
  es_data:
  ollama_data:

networks:
  rag-network:
    driver: bridge